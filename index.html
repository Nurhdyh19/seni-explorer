<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Eksplorer - Kuiz Seni Interaktif</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash-screen">
  <img src="splash.jpg" alt="Seni Eksplorer" id="splash-image">
</div>

<div id="loading-message" class="loading">Memuatkan data permainan...</div>

<div id="setup" style="display:none">
  <h2>⚙️ Tetapan Permainan</h2>
  <div class="setup-row">
    <label>Bilangan pemain:</label>
    <select id="num-players">
      <option value="2">2 pemain</option>
      <option value="3">3 pemain</option>
      <option value="4">4 pemain</option>
    </select>
  </div>
  <div class="setup-row">
    <label>Bilangan pusingan:</label>
    <select id="target-laps">
      <option value="1">1 pusingan</option>
      <option value="2">2 pusingan</option>
      <option value="3">3 pusingan</option>
      <option value="4" selected>4 pusingan</option>
      <option value="5">5 pusingan</option>
      <option value="6">6 pusingan</option>
      <option value="7">7 pusingan</option>
      <option value="8">8 pusingan</option>
      <option value="9">9 pusingan</option>
      <option value="10">10 pusingan</option>
    </select>
  </div>
  <div id="name-inputs"></div>
  <button id="start-btn">Mulakan Permainan 🎲</button>
</div>

<!-- THREE-COLUMN GAME AREA -->
<div id="game-area" style="display:none">
  <!-- LEFT SIDEBAR -->
  <div id="left-sidebar" class="sidebar">
    <div id="left-top" class="sidebar-block">
      <div id="utility-panel">
        <h1>🎨 Seni Eksplorer</h1>
        <div id="utility-btns">
          <button id="nav-home" class="nav-btn">🏠 Home</button>
          <button id="nav-restart" class="nav-btn">🔄 Restart Game</button>
          <button id="nav-install" class="nav-btn" style="display:none">⬇️ Pasang</button>
          <button id="nav-settings" class="nav-btn">⚙️ Settings</button>
          <button id="nav-guide" class="nav-btn">📖 Guide</button>
        </div>
      </div>
    </div>
    <div id="left-middle" class="sidebar-block ad-placeholder">
      <span>📢 Ruang Iklan</span>
    </div>
    <div id="left-bottom" class="sidebar-block playerlist-block">
      <div id="players-row"></div>
    </div>
  </div>

  <!-- CENTER COLUMN -->
  <div id="center-column" class="center-col">
    <div id="board-center-area">
      <div id="board-wrap">
        <img id="board-img" src="Copy_of_inovasi_2026.png" alt="Seni Eksplorer Board" onerror="this.src='https://placehold.co/800x800/2c3e50/F4A820?text=Board+Seni'"/>
        <div id="cells-layer"></div>
        <div id="tokens-layer"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT SIDEBAR -->
  <div id="right-sidebar" class="sidebar">
    <div id="right-top" class="sidebar-block messaging-block">
      <div id="log-container">
        <div id="log"></div>
      </div>
      <input id="game-feed" type="text" readonly value="Seni Eksplorer">
    </div>
    <div id="right-bottom" class="sidebar-block action-block">
      <div id="controls">
        <div id="dice-display">
          <div class="die" id="die">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
        </div>
        <button id="roll-btn">Buang Dadu</button>
        <span id="turn-label"></span>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-btns"></div>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div id="result-overlay" class="result-overlay">
  <span id="result-emoji" class="result-emoji">🎉</span>
  <div id="result-text" class="result-text"></div>
  <div id="result-question" class="result-question"></div>
  <div id="result-choices" class="result-choices"></div>
  <div id="result-points" class="result-points"></div>
  <img id="result-image" class="answer-img" style="display:none; margin-top:10px;" />
</div>

<!-- WINNER OVERLAY -->
<div id="winner-overlay" class="winner-overlay">
  <canvas id="confetti-canvas" class="confetti-canvas"></canvas>
  <div id="winner-box" class="winner-box">
    <div class="winner-crown">👑</div>
    <div class="winner-title">PEMENANG!</div>
    <div id="winner-name" class="winner-name"></div>
    <div class="winner-divider"></div>
    <div id="winner-scoreboard" class="winner-scoreboard"></div>
    <button id="winner-play-again" class="winner-play-again">🔄 Main Semula</button>
  </div>
</div>

<!-- SETTINGS PANEL -->
<div id="settings-panel" class="settings-panel">
  <div class="settings-content">
    <div class="settings-header">
      <h3>⚙️ Settings</h3>
      <button id="settings-close" class="settings-close">&times;</button>
    </div>
    <div class="settings-body">
      <div class="settings-row toggle-row">
        <button id="nav-sound" class="nav-btn">🔊 Sound ON</button>
        <button id="nav-music" class="nav-btn">🎵 Music ON</button>
      </div>
      <div class="settings-row">
        <label>Volum Muzik: <span id="music-vol-display-modal">15</span>%</label>
        <input type="range" id="music-volume-slider-modal" min="0" max="100" value="15" class="volume-slider">
      </div>
      <div class="settings-row">
        <label>Volum Kesan Bunyi: <span id="sfx-vol-display-modal">25</span>%</label>
        <input type="range" id="sfx-volume-slider-modal" min="0" max="100" value="25" class="volume-slider">
      </div>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/sound.js"></script>
<script src="js/localization.js"></script>
<script src="js/board.js"></script>
<script src="js/animations.js"></script>
<script src="js/gameLogic.js"></script>
<script src="js/dataLoader.js"></script>
<script src="js/main.js"></script>
</body>
</html>
