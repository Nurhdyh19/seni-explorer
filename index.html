<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seni Eksplorer - Kuiz Seni Interaktif</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
  h1{color:#F4A820;font-size:22px;font-weight:700;text-shadow:2px 2px 0 #8B4513;letter-spacing:1px}

  #board-wrap{position:relative;width:min(960px,95vw);aspect-ratio:1/1}
  #board-img{width:100%;height:100%;display:block;border-radius:10px;border:3px solid #8B4513}
  #cells-layer,#tokens-layer{position:absolute;top:0;left:0;width:100%;height:100%}
  .cell-hit{position:absolute;cursor:pointer;border-radius:3px;transition:background 0.15s}
  .cell-hit:hover{background:rgba(255,215,0,0.35);outline:2px solid gold}
  .cell-hit.highlight{background:rgba(255,215,0,0.5);outline:2px solid gold}
  
  .cell-flash { animation: cellFlash 0.6s ease-in-out 2; }
  @keyframes cellFlash {
    0% { background: rgba(255,215,0,0); outline: none; }
    30% { background: rgba(255,215,0,0.8); outline: 3px solid gold; }
    70% { background: rgba(255,215,0,0.8); outline: 3px solid gold; }
    100% { background: rgba(255,215,0,0); outline: none; }
  }

  .ptoken {
    position: absolute;
    width: 4.5%;
    height: 4.5%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(12px,2vw,22px);
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    transition: left 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.2), top 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.2);
    z-index: 20;
    pointer-events: none;
    transform: translate(-50%, -50%);
    will-change: left, top;
  }
  .ptoken.bounce { animation: tokenBounce 0.2s ease-out; }
  @keyframes tokenBounce {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* Subtle but visible active token glow - toned down */
  .ptoken.token-active {
    animation: gentlePulse 1.5s ease-in-out infinite;
    box-shadow: 0 0 0 3px rgba(244,168,32,0.5), 0 0 0 6px rgba(244,168,32,0.2), 0 2px 8px rgba(0,0,0,0.6);
    border: 2px solid #F4A820;
    filter: drop-shadow(0 0 3px rgba(244,168,32,0.5));
    z-index: 25;
  }
  @keyframes gentlePulse {
    0% {
      box-shadow: 0 0 0 3px rgba(244,168,32,0.5), 0 0 0 6px rgba(244,168,32,0.2);
      filter: drop-shadow(0 0 2px rgba(244,168,32,0.4));
      transform: translate(-50%, -50%) scale(1);
    }
    50% {
      box-shadow: 0 0 0 5px rgba(244,168,32,0.7), 0 0 0 10px rgba(244,168,32,0.3);
      filter: drop-shadow(0 0 5px rgba(244,168,32,0.6));
      transform: translate(-50%, -50%) scale(1.02);
    }
    100% {
      box-shadow: 0 0 0 3px rgba(244,168,32,0.5), 0 0 0 6px rgba(244,168,32,0.2);
      filter: drop-shadow(0 0 2px rgba(244,168,32,0.4));
      transform: translate(-50%, -50%) scale(1);
    }
  }

  #controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  
  #dice-display {
    width: 70px;
    height: 70px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 8px;
  }
  .die {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px;
    padding: 8px;
  }
  .dot {
    background-color: #e0e0e0;
    border-radius: 50%;
    width: 100%;
    height: 100%;
    transition: background-color 0.05s;
  }
  .dot.lit { background-color: #1a1a2e; box-shadow: inset 0 1px 2px rgba(0,0,0,0.2); }
  
  @keyframes rollShake {
    0% { transform: rotate(0deg) scale(1); }
    15% { transform: rotate(15deg) scale(1.1); }
    30% { transform: rotate(-10deg) scale(1.15); }
    50% { transform: rotate(8deg) scale(1.2); }
    70% { transform: rotate(-5deg) scale(1.1); }
    100% { transform: rotate(0deg) scale(1); }
  }
  .rolling { animation: rollShake 0.5s cubic-bezier(0.25, 1.5, 0.5, 1); }

  button{font-size:13px;padding:8px 18px;border-radius:8px;border:1.5px solid #F4A820;background:#1a1a2e;color:#F4A820;cursor:pointer;font-weight:600;transition:all 0.15s}
  button:hover{background:#F4A820;color:#1a1a2e}
  button:active{transform:scale(0.96)}
  #roll-btn{background:#F4A820;color:#1a1a2e}
  #roll-btn:hover{background:#d4920a}
  #roll-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #players-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .player-card{background:#16213e;border-radius:10px;padding:8px 14px;border:2px solid #333;display:flex;align-items:center;gap:8px;transition:border-color 0.3s}
  .player-card.active{border-color:#F4A820;box-shadow:0 0 10px rgba(244,168,32,0.4)}
  .token-badge{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid rgba(255,255,255,0.3)}
  .player-name{font-weight:600;color:#fff;font-size:13px}
  .player-score{color:#aaa;font-size:11px;margin-top:1px}

  #log-wrap{background:#0f0f23;border-radius:8px;padding:8px 12px;width:min(960px,95vw);max-height:70px;overflow-y:auto;border:1px solid #333}
  #log{font-size:11px;color:#aaa;line-height:1.7}

  #setup{background:#16213e;border-radius:14px;padding:20px;width:min(400px,95vw);border:2px solid #F4A820;color:#fff}
  #setup h2{color:#F4A820;font-size:18px;font-weight:700;margin-bottom:14px;text-align:center}
  .setup-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:13px;color:#ccc}
  select,input[type=text]{font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid #444;background:#0f0f23;color:#fff;width:160px}
  #start-btn{width:100%;margin-top:10px;padding:10px;font-size:15px;background:#F4A820;color:#1a1a2e;border:none;border-radius:8px;cursor:pointer;font-weight:700}
  #start-btn:hover{background:#d4920a}

  #modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:300}
  #modal.show{display:flex}
  #modal-box{background:#16213e;border-radius:16px;padding:24px;max-width:440px;width:92%;text-align:center;border:2px solid #F4A820;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
  #modal-title{font-size:18px;font-weight:700;margin-bottom:12px;color:#F4A820}
  #modal-body{font-size:14px;color:#ddd;margin-bottom:20px;line-height:1.6}
  #quiz-options{display:flex;flex-direction:column;gap:10px;margin:15px 0 10px}
  .quiz-opt-btn{background:#0f0f23;border:1.5px solid #F4A820;border-radius:30px;padding:10px 12px;font-size:13px;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;transition:0.1s;color:#fff}
  .quiz-opt-btn:hover{background:#F4A820;color:#1a1a2e;border-color:#fff}
  .opt-prefix{font-weight:800;font-size:16px;min-width:32px}
  #modal-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  #turn-label{color:#F4A820;font-size:13px;font-weight:600}
  .loading{text-align:center;color:#F4A820;padding:20px}

  .result-overlay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(8px);
    border-radius: 60px;
    padding: 20px 40px;
    text-align: center;
    z-index: 400;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    border: 3px solid gold;
    box-shadow: 0 0 30px rgba(244,168,32,0.6);
  }
  .result-overlay.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }
  .result-correct { background: #1e4620; border-color: #2ecc71; }
  .result-wrong { background: #5c1a1a; border-color: #e74c3c; }
  .result-emoji { font-size: 48px; display: block; margin-bottom: 8px; }
  .result-text { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
  .result-points { font-size: 18px; margin-top: 8px; color: #F4A820; }
</style>
</head>
<body>

<h1>🎨 Seni Eksplorer</h1>

<div id="loading-message" class="loading">Memuatkan data permainan...</div>

<div id="setup" style="display:none">
  <h2>⚙️ Tetapan Permainan</h2>
  <div class="setup-row">
    <label>Bilangan pemain:</label>
    <select id="num-players">
      <option value="2">2 pemain</option>
      <option value="3">3 pemain</option>
      <option value="4">4 pemain</option>
    </select>
  </div>
  <div id="name-inputs"></div>
  <button id="start-btn">Mulakan Permainan 🎲</button>
</div>

<div id="game-area" style="display:none;flex-direction:column;align-items:center;gap:12px;width:100%">
  <div id="board-wrap">
    <img id="board-img" src="Copy_of_inovasi_2026.png" alt="Seni Eksplorer Board" onerror="this.src='https://placehold.co/800x800/2c3e50/F4A820?text=Board+Seni'"/>
    <div id="cells-layer"></div>
    <div id="tokens-layer"></div>
  </div>
  <div id="players-row"></div>
  <div id="controls">
    <div id="dice-display">
      <div class="die" id="die">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
    <button id="roll-btn">Buang Dadu</button>
    <span id="turn-label"></span>
  </div>
  <div id="log-wrap"><div id="log"></div></div>
</div>

<div id="modal">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-btns"></div>
  </div>
</div>

<div id="result-overlay" class="result-overlay">
  <span id="result-emoji" class="result-emoji">🎉</span>
  <div id="result-text" class="result-text"></div>
  <div id="result-points" class="result-points"></div>
</div>

<script>
let SPACE_POS = [];
let SPACES = [];
let QUIZ_BANK = {};
let players = [], currentPlayer = 0, rolled = false;
let isMoving = false;
const COLORS = ['#E74C3C','#3498DB','#2ECC71','#9B59B6'];
const EMOJIS = ['🎨','🖌️','✏️','🖼️'];

const DIE_PATTERNS = { 1:[5], 2:[3,7], 3:[3,5,7], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };

function updateDieFace(value) {
  const dots = document.querySelectorAll('#die .dot');
  dots.forEach(dot => dot.classList.remove('lit'));
  const positions = DIE_PATTERNS[value];
  if (positions) positions.forEach(pos => { if (dots[pos-1]) dots[pos-1].classList.add('lit'); });
}

async function animateRoll(finalValue) {
  const rollBtn = document.getElementById('roll-btn');
  rollBtn.disabled = true;
  const diceContainer = document.getElementById('dice-display');
  diceContainer.classList.add('rolling');
  const steps = 16;
  const interval = 25;
  for (let i = 0; i <= steps; i++) {
    if (i === steps) updateDieFace(finalValue);
    else updateDieFace(Math.floor(Math.random() * 6) + 1);
    await new Promise(r => setTimeout(r, interval));
  }
  setTimeout(() => {
    diceContainer.classList.remove('rolling');
    rollBtn.disabled = false;
  }, 100);
}

function addBounceToToken(playerIndex) {
  const tokens = document.querySelectorAll('#tokens-layer .ptoken');
  if (tokens[playerIndex]) {
    tokens[playerIndex].classList.add('bounce');
    setTimeout(() => tokens[playerIndex].classList.remove('bounce'), 200);
  }
}

async function animateStepwise(player, steps) {
  let currentPos = player.pos;
  for (let step = 1; step <= steps; step++) {
    let nextPos = (currentPos + 1) % SPACES.length;
    if (nextPos < currentPos && currentPos !== 0) {
      player.score += 5;
      addLog(`${player.emoji} Melepasi petak MULA! +5 mata`);
    }
    player.pos = nextPos;
    renderTokens();
    addBounceToToken(players.indexOf(player));
    highlightCell(nextPos);
    await new Promise(r => setTimeout(r, 250));
    currentPos = nextPos;
  }
  clearHighlight();
  renderPlayers();
  return currentPos;
}

function flashCell(cellId) {
  return new Promise((resolve) => {
    const cell = document.getElementById(cellId);
    if (!cell) { resolve(); return; }
    cell.classList.add('cell-flash');
    setTimeout(() => {
      cell.classList.remove('cell-flash');
      resolve();
    }, 650);
  });
}

function buildNameInputs() {
  const numSelect = document.getElementById('num-players');
  if (!numSelect) return;
  const n = parseInt(numSelect.value);
  const container = document.getElementById('name-inputs');
  container.innerHTML = '';
  for (let i = 0; i < n; i++) {
    container.innerHTML += `<div class="setup-row"><label>${EMOJIS[i]} Pemain ${i+1}:</label><input id="pname${i}" type="text" value="Pemain ${i+1}"></div>`;
  }
}

async function loadGameData() {
  try {
    const response = await fetch('game-data.yaml');
    if (!response.ok) throw new Error(`HTTP ${response.status}: fail game-data.yaml tidak dijumpai`);
    const yamlText = await response.text();
    const data = jsyaml.load(yamlText);
    SPACE_POS = data.space_positions;
    SPACES = data.board_spaces;
    QUIZ_BANK = data.quiz_bank;
    if (!SPACE_POS || !SPACES || !QUIZ_BANK) throw new Error('Data YAML tidak lengkap');
    document.getElementById('loading-message').style.display = 'none';
    document.getElementById('setup').style.display = 'block';
    buildNameInputs();
  } catch (err) {
    document.getElementById('loading-message').innerHTML = `❌ Ralat: ${err.message}<br>Pastikan fail <strong>game-data.yaml</strong> berada di folder yang sama.`;
  }
}

function startGame() {
  const numSelect = document.getElementById('num-players');
  const n = parseInt(numSelect.value);
  players = [];
  for (let i = 0; i < n; i++) {
    const nameInput = document.getElementById('pname' + i);
    const name = nameInput ? nameInput.value : `Pemain ${i+1}`;
    players.push({name, pos: 0, score: 0, color: COLORS[i], emoji: EMOJIS[i], jailed: false});
  }
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game-area').style.display = 'flex';
  buildCells();
  renderTokens();
  renderPlayers();
  updateTurnLabel();
  addLog("🎉 Permainan bermula! Giliran pertama.");
  rolled = false;
  isMoving = false;
  updateDieFace(1);
  updateActiveToken();
}

function buildCells() {
  const layer = document.getElementById('cells-layer');
  layer.innerHTML = '';
  SPACE_POS.forEach(([lp, tp], idx) => {
    const sp = SPACES[idx];
    if (!sp) return;
    const isCorner = sp.type === 'corner';
    const w = isCorner ? 13.3 : 7.1;
    const h = isCorner ? 13.3 : 7.1;
    const el = document.createElement('div');
    el.className = 'cell-hit';
    el.id = 'cell-' + idx;
    el.style.cssText = `left:${lp - w/2}%;top:${tp - h/2}%;width:${w}%;height:${h}%;`;
    el.title = sp.label;
    el.onclick = () => onCellClick(idx);
    layer.appendChild(el);
  });
}

function onCellClick(idx) {
  const sp = SPACES[idx];
  if (sp) showModal('INFO Ruang ' + idx, sp.label || 'Tiada keterangan', [{label:'Tutup', fn: closeModal}]);
}

function playBeep(isCorrect) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.type = 'sine';
    oscillator.frequency.value = isCorrect ? 880 : 440;
    gainNode.gain.value = 0.2;
    oscillator.start();
    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
    oscillator.stop(audioCtx.currentTime + 0.5);
    audioCtx.resume().catch(e => {});
  } catch(e) {}
}

function showResult(isCorrect, pointsEarned, correctAnswerLetter, correctAnswerText, onClose) {
  const overlay = document.getElementById('result-overlay');
  const emojiSpan = document.getElementById('result-emoji');
  const textDiv = document.getElementById('result-text');
  const pointsDiv = document.getElementById('result-points');
  if (isCorrect) {
    overlay.classList.add('result-correct');
    overlay.classList.remove('result-wrong');
    emojiSpan.textContent = '✅🎉';
    textDiv.textContent = `BETUL!`;
    pointsDiv.textContent = `+${pointsEarned} mata`;
  } else {
    overlay.classList.add('result-wrong');
    overlay.classList.remove('result-correct');
    emojiSpan.textContent = '❌😢';
    textDiv.textContent = `SALAH!`;
    pointsDiv.textContent = `Jawapan betul: ${correctAnswerLetter}. ${correctAnswerText}`;
  }
  overlay.classList.add('show');
  setTimeout(() => {
    overlay.classList.remove('show');
    if (onClose) onClose();
  }, 1800);
}

async function rollDice() {
  if (rolled || isMoving) { addLog("⏳ Selesaikan giliran atau tunggu token bergerak."); return; }
  const curr = players[currentPlayer];
  if (curr.jailed) {
    showModal("🚔 DI PENJARA!", `${curr.emoji} ${curr.name} masih dipenjarakan. Giliran dilangkau!`, [{
      label: "OK", fn: () => {
        closeModal();
        addLog(`⛓️ ${curr.name} dalam penjara, langkau giliran.`);
        curr.jailed = false;
        endTurn();
      }
    }]);
    return;
  }
  
  const dieValue = Math.floor(Math.random() * 6) + 1;
  await animateRoll(dieValue);
  rolled = true;
  isMoving = true;
  const p = players[currentPlayer];
  const finalPos = await animateStepwise(p, dieValue);
  await flashCell('cell-' + finalPos);
  addLog(`${p.emoji} ${p.name}: Dadu ${dieValue} → gerak ke ruang ${finalPos} (${SPACES[finalPos].label})`);
  renderPlayers();
  await new Promise(r => setTimeout(r, 300));
  handleLanding(p, SPACES[finalPos]);
}

function handleLanding(p, sp) {
  if (!sp) return;
  if (sp.type === 'corner') {
    if (sp.id === 10) {
      showModal("🚔 GO TO JAIL", `${p.emoji} ${p.name} ditangkap! Anda dipenjarakan dan akan kehilangan giliran seterusnya.`, [{
        label: "Okay...", fn: () => {
          p.jailed = true;
          closeModal();
          addLog(`${p.name} dipenjarakan!`);
          renderPlayers();
          endTurn();
        }
      }]);
    } else {
      addLog(`${p.name} tiba di ${sp.label}. Tiada kuiz.`);
      endTurn();
    }
    return;
  }
  const quiz = QUIZ_BANK[sp.id];
  if (!quiz) {
    addLog(`Ruang ${sp.id} tiada data kuiz, tiada mata.`);
    endTurn();
    return;
  }
  const pts = sp.pts || 1;
  const letters = ['A', 'B', 'C', 'D'];
  const modalBody = `
    <div style="font-weight:bold; margin-bottom:10px; color:#F4A820;">🎨 ${quiz.soalan}</div>
    <div style="font-size:12px; margin-bottom:8px;">⭐ Nilai: ${pts} mata (pilih jawapan)</div>
    <div id="quiz-options"></div>
  `;
  document.getElementById('modal-title').innerHTML = `📝 Cabaran Seni — Ruang ${sp.id}`;
  document.getElementById('modal-body').innerHTML = modalBody;
  const btnsDiv = document.getElementById('modal-btns');
  btnsDiv.innerHTML = '';
  const optionsContainer = document.getElementById('quiz-options');
  optionsContainer.innerHTML = '';
  
  quiz.pilihan.forEach((opt, idx) => {
    const btn = document.createElement('div');
    btn.className = 'quiz-opt-btn';
    btn.innerHTML = `<span class="opt-prefix">${letters[idx]}</span> <span>${opt}</span>`;
    btn.onclick = () => {
      const isCorrect = (idx === quiz.jawapan);
      const correctLetter = letters[quiz.jawapan];
      const correctText = quiz.pilihan[quiz.jawapan];
      if (isCorrect) {
        p.score += pts;
        addLog(`✅ ${p.emoji} ${p.name} menjawab BETUL! +${pts} mata. (Jawapan: ${letters[idx]})`);
        playBeep(true);
      } else {
        addLog(`❌ ${p.emoji} ${p.name} menjawab SALAH. Jawapan betul: ${correctLetter}. ${correctText}. Tiada mata.`);
        playBeep(false);
      }
      renderPlayers();
      closeModal();
      showResult(isCorrect, pts, correctLetter, correctText, () => endTurn());
    };
    optionsContainer.appendChild(btn);
  });
  const cancelBtn = document.createElement('button');
  cancelBtn.textContent = 'Batal / Skip (tiada mata)';
  cancelBtn.style.backgroundColor = '#444';
  cancelBtn.onclick = () => {
    addLog(`${p.emoji} ${p.name} memilih untuk tidak menjawab. Tiada mata.`);
    closeModal();
    endTurn();
  };
  btnsDiv.appendChild(cancelBtn);
  document.getElementById('modal').classList.add('show');
}

function endTurn() {
  if (!rolled && !isMoving) return;
  rolled = false;
  isMoving = false;
  updateDieFace(1);
  clearHighlight();
  currentPlayer = (currentPlayer + 1) % players.length;
  updateTurnLabel();
  renderPlayers();
  updateActiveToken();
  checkWinner();
  addLog(`🔄 Giliran bertukar kepada ${players[currentPlayer].emoji} ${players[currentPlayer].name}`);
}

function checkWinner() {
  const winner = players.find(p => p.score >= 30);
  if (winner) {
    showModal('🏆 TAHNIAH!', `${winner.emoji} ${winner.name} menang dengan ${winner.score} mata! 🎉`, [{label: 'Hebat!', fn: () => location.reload()}]);
  }
}

function updateActiveToken() {
  const allTokens = document.querySelectorAll('#tokens-layer .ptoken');
  allTokens.forEach(t => t.classList.remove('token-active'));
  if (players[currentPlayer]) {
    const tokens = document.querySelectorAll('#tokens-layer .ptoken');
    if (tokens[currentPlayer]) tokens[currentPlayer].classList.add('token-active');
  }
}

function highlightCell(id) {
  document.querySelectorAll('.cell-hit.highlight').forEach(c => c.classList.remove('highlight'));
  const el = document.getElementById('cell-'+id); if (el) el.classList.add('highlight');
}
function clearHighlight() { document.querySelectorAll('.cell-hit.highlight').forEach(c => c.classList.remove('highlight')); }

function renderTokens() {
  const layer = document.getElementById('tokens-layer');
  if (!layer) return;
  layer.innerHTML = '';
  players.forEach((p, i) => {
    const [lp, tp] = SPACE_POS[p.pos] || [50, 50];
    const offsets = [[0,0], [3.5,0], [0,3.5], [3.5,3.5]];
    const [ox, oy] = offsets[i % 4];
    const el = document.createElement('div');
    el.className = 'ptoken';
    el.style.left = (lp + ox * 0.8) + '%';
    el.style.top = (tp + oy * 0.8) + '%';
    el.style.background = p.color;
    el.textContent = p.emoji;
    layer.appendChild(el);
  });
  updateActiveToken();
}

function renderPlayers() {
  const container = document.getElementById('players-row');
  container.innerHTML = players.map((p, i) =>
    `<div class="player-card${i === currentPlayer ? ' active' : ''}">
      <div class="token-badge" style="background:${p.color}">${p.emoji}</div>
      <div>
        <div class="player-name">${p.name} ${p.jailed ? '🚫' : ''}</div>
        <div class="player-score">⭐ ${p.score} mata</div>
      </div>
    </div>`
  ).join('');
}

function updateTurnLabel() {
  const p = players[currentPlayer];
  document.getElementById('turn-label').textContent = `Giliran: ${p.emoji} ${p.name} ${p.jailed ? '(Dipenjara)' : ''}`;
}

function addLog(msg) {
  const logDiv = document.getElementById('log');
  logDiv.innerHTML += `<div>› ${msg}</div>`;
  logDiv.parentElement.scrollTop = logDiv.parentElement.scrollHeight;
}

function showModal(title, body, btns) {
  document.getElementById('modal-title').textContent = title;
  const mb = document.getElementById('modal-body');
  if (typeof body === 'string') mb.innerHTML = body.replace(/\n/g, '<br>');
  else mb.innerHTML = body;
  const bc = document.getElementById('modal-btns');
  bc.innerHTML = '';
  (btns || [{label: 'Tutup', fn: closeModal}]).forEach((b, i) => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    if (i === 0) btn.style.cssText = 'background:#F4A820;color:#1a1a2e;border-color:#F4A820';
    btn.onclick = b.fn;
    bc.appendChild(btn);
  });
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('num-players')?.addEventListener('change', buildNameInputs);
  document.getElementById('start-btn')?.addEventListener('click', startGame);
  document.getElementById('roll-btn')?.addEventListener('click', rollDice);
  loadGameData();
});
</script>
</body>
</html>
