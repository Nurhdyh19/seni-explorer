# ---------- GUIDE MODAL (plain text with bullet points) ----------
# Use "- " at the beginning of a line to create a bullet.
# Blank lines will create spacing.
# The {laps} placeholder will be replaced with the target laps.
guide_title: "📖 Panduan Permainan"
guide_content: |
  🎮 Cara Bermain:
  - Tekan 🎲 Buang Dadu untuk membaling dadu.
  - Token anda akan bergerak mengikut nombor dadu.
  - Mendarat di ruang Kuiz → jawab soalan seni untuk dapat mata.
  - Mendarat di ruang Lukisan → lakukan cabaran lukisan di kertas.
  - Lengkapkan pusingan untuk meningkatkan lap anda.
  - Pemain pertama mencapai {laps} pusingan akan menang!

  ⭐ Mata:
  - Kuiz betul → dapat mata mengikut nilai ruang.
  - Cabaran lukisan → nilai bergantung pada kreativiti.
  - Penjara → akan kehilangan giliran seterusnya.

  Selamat bermain dan jadi peneroka seni terbaik! 🎨

