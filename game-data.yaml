# ============================================================

# ------------------------------------------------------------
# QUIZ BANK for spaces that have multiple-choice questions
# Each entry key = space ID (1..36, except corners)
# ------------------------------------------------------------
quiz_bank:
  1:
    soalan: "Unsur seni manakah paling menonjol dalam karya catan tradisional?"
    pilihan: ["Garisan", "Warna", "Bentuk", "Jalinan"]
    jawapan: 1            # 0=A, 1=B, 2=C, 3=D
  2:
    soalan: "Garisan melengkung menunjukkan pergerakan apa?"
    pilihan: ["Kestabilan", "Kekerasan", "Lembut & dinamik", "Statik"]
    jawapan: 2
  3:
    soalan: "Bentuk geometri manakah yang tidak mempunyai sudut?"
    pilihan: ["Segi empat", "Segi tiga", "Bulatan", "Heksagon"]
    jawapan: 2
  4:
    soalan: "Nyatakan 3 jenis garisan asas dalam seni visual."
    pilihan: ["Lurus, beralun, zig-zag", "Tebal, nipis, putus-putus", "Melintang, menegak, pepenjuru", "Melengkung, berpusing, beralun"]
    jawapan: 2
  5:
    soalan: "Rupa organik merujuk kepada bentuk..."
    pilihan: ["Geometri tepat", "Bebas & semula jadi", "Binaan manusia", "Abstrak rawak"]
    jawapan: 1
  6:
    soalan: "Rupa geometri yang mempunyai 4 sisi sama panjang."
    pilihan: ["Segi empat tepat", "Segi empat sama", "Belah ketupat", "Trapezium"]
    jawapan: 1
  7:
    soalan: "Prinsip rekaan yang menunjukkan perbezaan ketara dipanggil?"
    pilihan: ["Harmoni", "Kontra", "Irama", "Keseimbangan"]
    jawapan: 1
  8:
    soalan: "Warna sekunder terhasil daripada campuran dua warna..."
    pilihan: ["Primer", "Tersier", "Neutral", "Pastel"]
    jawapan: 0
  9:
    soalan: "Warna panas biasanya memberikan rasa..."
    pilihan: ["Dingin & tenang", "Ceria & bertenaga", "Sedih", "Sayu"]
    jawapan: 1
  11:
    soalan: "Prinsip keseimbangan simetri bermaksud?"
    pilihan: ["Kiri dan kanan sama", "Berat visual tidak sama", "Unsur bebas", "Berselerak"]
    jawapan: 0
  12:
    soalan: "Warna apakah yang terhasil daripada campuran merah + biru?"
    pilihan: ["Hijau", "Ungu", "Jingga", "Kelabu"]
    jawapan: 1
  13:
    soalan: "Corak berulang dalam seni dikenali sebagai..."
    pilihan: ["Motif", "Ritma", "Ilusi", "Tekstur"]
    jawapan: 1
  14:
    soalan: "Contoh corak geometri?"
    pilihan: ["Daun berguguran", "Ombak", "Segi tiga bersusun", "Bunga liar"]
    jawapan: 2
  15:
    soalan: "Satu karya mempunyai 5 warna. Apakah jenis skema warna?"
    pilihan: ["Monokrom", "Analogus", "Polikrom", "Komplementari"]
    jawapan: 2
  16:
    soalan: "Warna asas (primer) terdiri daripada?"
    pilihan: ["Merah, Kuning, Biru", "Hijau, Jingga, Ungu", "Hitam, Putih, Kelabu", "Merah, Hijau, Biru"]
    jawapan: 0
  17:
    soalan: "Bayangan dalam lukisan memberi ilusi..."
    pilihan: ["Kedalaman", "Kecerahan", "Kontras", "Garisan"]
    jawapan: 0
  18:
    soalan: "Sudut pandangan ‘mata burung’ bermaksud?"
    pilihan: ["Dari atas", "Dari bawah", "Aras mata", "Dari sisi"]
    jawapan: 0
  19:
    soalan: "Apakah jenis sudut dalam lukisan perspektif?"
    pilihan: ["Satu titik", "Dua titik", "Tiga titik", "Semua di atas"]
    jawapan: 3
  21:
    soalan: "Ritma dalam seni dihasilkan melalui?"
    pilihan: ["Pengulangan unsur", "Warna gelap", "Kekurangan kontras", "Saiz besar"]
    jawapan: 0
  22:
    soalan: "Garisan zig-zag memberikan perasaan?"
    pilihan: ["Tenang", "Kecelaruan/gerak pantas", "Lembut", "Melambai"]
    jawapan: 1
  23:
    soalan: "Ilusi 3D pada permukaan 2D menggunakan teknik?"
    pilihan: ["Perspektif", "Kolaj", "Mozaik", "Stensil"]
    jawapan: 0
  24:
    soalan: "Warna panas yang manakah paling terang?"
    pilihan: ["Merah", "Jingga", "Kuning", "Magenta"]
    jawapan: 2
  25:
    soalan: "Campuran warna biru + kuning menghasilkan?"
    pilihan: ["Hijau", "Ungu", "Kelabu", "Jingga"]
    jawapan: 0
  26:
    soalan: "Unsur seni yang merujuk kepada kualiti permukaan?"
    pilihan: ["Rupa", "Jalinan", "Warna", "Bentuk"]
    jawapan: 1
  27:
    soalan: "Warna sejuk seperti biru sering dikaitkan dengan?"
    pilihan: ["Api", "Air/tenang", "Marah", "Ceria"]
    jawapan: 1
  28:
    soalan: "Lukisan jalan mengecil ke belakang menggunakan prinsip?"
    pilihan: ["Saiz", "Perspektif udara", "Perspektif linear", "Kontras"]
    jawapan: 2
  30:
    soalan: "Prinsip keseimbangan tidak formal memberikan rasa..."
    pilihan: ["Tegar", "Dinamik & santai", "Monoton", "Kaku"]
    jawapan: 1
  31:
    soalan: "Pergerakan dalam seni boleh ditunjukkan melalui?"
    pilihan: ["Garisan dinamik", "Warna statik", "Bentuk sama", "Ulangan kaku"]
    jawapan: 0
  32:
    soalan: "Objek tidak simetri mempunyai ciri..."
    pilihan: ["Bahagian kiri ≠ kanan", "Bahagian sama", "Bulat sempurna", "Sudut tepat"]
    jawapan: 0
  33:
    soalan: "Prinsip harmoni terhasil apabila unsur-unsur..."
    pilihan: ["Bercanggah", "Bersatu padu", "Terasing", "Kontra tinggi"]
    jawapan: 1
  34:
    soalan: "Kontras boleh dicapai melalui perbezaan..."
    pilihan: ["Warna terang/gelap", "Bentuk sama", "Saiz seragam", "Rupa identik"]
    jawapan: 0
  35:
    soalan: "Penegasan dalam sesebuah karya bertujuan untuk?"
    pilihan: ["Menonjolkan fokus utama", "Menyembunyikan elemen", "Mengelirukan", "Mengurangkan nilai"]
    jawapan: 0
  36:
    soalan: "Poster yang baik menggunakan prinsip rekaan apa?"
    pilihan: ["Keseimbangan & kontras", "Hanya warna", "Hanya teks", "Tiada ruang kosong"]
    jawapan: 0

